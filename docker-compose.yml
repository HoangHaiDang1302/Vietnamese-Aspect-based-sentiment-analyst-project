version: '3.8'

services:
  absa-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vietnamese-absa
    ports:
      - "8000:8000"
    environment:
      - DEFAULT_MODEL=bigru_crf
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
